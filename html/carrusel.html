<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../css/carrusel.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Carrusel de Fotos</title>
</head>

<body>

<header>
    <div class="header-title">Carrusel</div>

    <nav class="navbar navbar-expand-xl navbar-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="../indice/index.html">
                <img src="../imagenes/logo.jpg">
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarWithDropdown"
                    aria-controls="navbarWithDropdown"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarWithDropdown">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="../indice/index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="secundari01.html">Principal</a></li>
                    <li class="nav-item"><a class="nav-link" href="secundari02.html">Secundario</a></li>
                    <li class="nav-item"><a class="nav-link" href="secundari03.html">Tercero</a></li>
                    <li class="nav-item"><a class="nav-link" href="secundari04.html">Cuarto</a></li>
                    <li class="nav-item"><a class="nav-link" href="secundari05.html">Quinto</a></li>
                    <li class="nav-item"><a class="nav-link active" href="carrusel.html">Carrusel</a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<main class="container my-5">
    <h1 class="text-center mb-5">Carrusel de Fotos</h1>

    <div id="carruselFotos" class="carousel slide" data-bs-ride="carousel">

        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carruselFotos" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#carruselFotos" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#carruselFotos" data-bs-slide-to="2"></button>
            <button type="button" data-bs-target="#carruselFotos" data-bs-slide-to="3"></button>
            <button type="button" data-bs-target="#carruselFotos" data-bs-slide-to="4"></button>
            <button type="button" data-bs-target="#carruselFotos" data-bs-slide-to="5"></button>
        </div>

        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="../imagenes/starwars.jpg" class="d-block w-100" alt="Star Wars">
                <div class="carousel-caption d-none d-md-block">
                    <h5>La Guerra de las Galaxias</h5>
                </div>
            </div>

            <div class="carousel-item">
                <img src="../imagenes/spider.jpg" class="d-block w-100" alt="Spider-Man">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Spider-Man</h5>
                </div>
            </div>

            <div class="carousel-item">
                <img src="../imagenes/xmen.jpg" class="d-block w-100" alt="X-Men">
                <div class="carousel-caption d-none d-md-block">
                    <h5>X-Men</h5>
                </div>
            </div>

            <div class="carousel-item">
                <img src="../imagenes/iron.jpg" class="d-block w-100" alt="Ironman">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Ironman</h5>
                </div>
            </div>

            <div class="carousel-item">
                <img src="../imagenes/thor.jpg" class="d-block w-100" alt="Thor">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Thor Marvel</h5>
                </div>
            </div>

            <div class="carousel-item">
                <img src="../imagenes/luke.jpg" class="d-block w-100" alt="Luke Skywalker">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Luke Skywalker</h5>
                </div>
            </div>
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#carruselFotos" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#carruselFotos" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>

    </div>
</main>

<footer class="text-center py-4 mt-5">
    Jesús García Casado
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
